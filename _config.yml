content:
  - title: Career
    layout: list
    content:
      - layout: left
        title: 더즌
        sub_title: 백엔드 개발자
        caption: 2022.08 ~ 현재
        description: |
          금융사와 연계되는 정기결제·자동납부, 가상계좌 및 카카오페이 청구서 서비스를 개발·운영했습니다. 금융 전문 송수신부터 거래 데이터 저장·대사, 집금·정산, 펌뱅킹과 운영 백오피스까지 거래 처리 전반을 담당했습니다.
      - layout: left
        sub_title: 정기결제·자동납부 시스템 구축 및 운영
        caption: 2022.08 ~ 현재
        description: |
          * 카드·계좌 기반 정기결제·자동납부 시스템을 구축하여 금융사 연계부터 거래 대사, 집금·정산까지 처리 과정을 자동화
          * 10여 개 은행·카드사의 상이한 전문 생성·송수신 로직을 공통 인터페이스와 기관별 구현체로 분리하여 개별 규격에 대응
          * Netty 기반 TCP/IP 통신과 JSch 기반 SFTP 파일 송수신 기능 및 금융사 연계 현황 관리·모니터링 배치 개발
          * 집금·정산 및 펌뱅킹 배치를 개발하고, 월 정산 거래의 펌뱅킹 요청을 비동기로 처리하는 구조 구현
          * 금융 전문 생성 배치에서 대량 INSERT 처리 병목이 발생하여, MyBatis `<foreach>` 기반 다건 INSERT를 `ExecutorType.BATCH` 방식으로 변경하고 처리 시간을 40초에서 3초로 단축

          **기술**: Java, Spring Boot, MyBatis, Oracle, Netty, JSch, TCP/IP, SFTP, Linux
      - layout: left
        sub_title: 카카오페이 청구서 연동 및 거래 대사 시스템
        caption: 2024.08 ~ 현재
        description: |
          * 월 평균 약 40억 원 규모의 카카오페이 청구서 납부 거래를 처리하는 연동 API 개발·운영
          * 청구서 상세 조회, 납부 가능 여부 조회 및 납부 결과 처리 API 개발
          * 카카오페이 납부 내역과 내부 거래 데이터를 비교하여 정합성을 검증하는 거래 대사 배치 개발
          * 납부처별 마감일과 영업일 D-3 조건을 반영해 안내 대상자를 산정하고, 비즈톡 기반 카카오톡 알림톡 발송 배치 개발

          **기술**: Java, Spring Boot, MyBatis, MS-SQL, Windows Server
      - layout: left
        sub_title: 가상계좌 입금 처리 및 부가서비스 연계
        caption: 2024.08 ~ 현재
        description: |
          * 금융사·중계사의 가상계좌 수취조회 요청에 입금 가능 여부와 수취인명을 응답하는 API 및 입금 거래 처리 API 개발
          * 요청·응답 전문과 입금 거래 데이터를 원장으로 저장하고 거래 유형별 처리 결과를 관리
          * 문자 서비스·법인세 등 부가서비스의 가상계좌 입금 내역을 공통 처리하는 배치 개발
          * 문자 서비스의 입금 처리 결과를 충전 현황에 반영하는 배치 개발

          **기술**: Java, Spring Boot, MyBatis, MS-SQL, Linux
      - layout: left
        sub_title: 정기결제·정산 서비스 운영 백오피스
        caption: 2022.08 ~ 현재
        description: |
          * 정기결제·정산, 카카오페이 청구서 및 가상계좌의 거래 내역·처리 결과·정산 현황을 조회·관리하는 운영 백오피스 개발
          * 일반 거래 조회에는 Spring Data JPA를 적용하고 복잡한 집계 조회에는 MyBatis를 사용하여 조회 목적에 따라 데이터 접근 방식 구분

          **기술**: Java, Spring Boot, Spring Data JPA, MyBatis, Oracle, MS-SQL, JavaScript, Linux, Windows Server
      - layout: left
        sub_title: .NET 레거시 시스템의 Java 전환 및 배포 자동화
        caption: 2024.01 ~ 2024.08
        description: |
          * ERP 외부 연계 서비스와 배치 시스템을 .NET Framework에서 Java/Spring Boot로 전환하여 기술 스택 통일
          * 절차지향적으로 구현된 기존 로직을 객체지향 구조로 재설계하고 중복 로직을 공통 모듈로 분리
          * GitLab Tag를 기준으로 Jenkins가 배포 파일 생성, Nexus 저장 및 배포 스크립트 실행을 수행하는 자동 배포 파이프라인 구축

          **기술**: Java, Spring Boot, MyBatis, MS-SQL, Jenkins, GitLab, Nexus, Windows Server
      - layout: left
        sub_title: 운영 서버 이관 및 컨테이너 배포 환경 구축
        caption: 2026.04 ~ 2026.05
        description: |
          * Linux 운영 서버를 신규 서버로 이관하고 Docker 기반 컨테이너 실행 환경 재구축
          * GitLab Push·Tag 이벤트를 트리거로 Docker 이미지를 빌드하여 Nexus Registry에 저장하는 Drone.io 파이프라인 구축
          * Nexus Registry의 버전별 이미지를 선택해 배포할 수 있도록 Portainer 기반 컨테이너 배포 환경 구성
          * Filebeat와 Elastic Stack 연계를 이관하여 API·배치 거래 로그 모니터링 및 오류 추적 환경 유지

          **기술**: Linux, Docker, Drone.io, Nexus, Portainer, GitLab, Filebeat, Elastic Stack
      - layout: left
        title: 씨엔티테크
        sub_title: 백엔드 개발자
        caption: 2018.01 ~ 2022.04
        description: |
          카카오톡 주문하기와 태국 LINE MAN 주문 서비스의 주문·결제 API, 외부 쿠폰 연계, 데이터 동기화 배치 및 운영 백오피스를 개발했습니다.
      - layout: left
        sub_title: 카카오톡 주문하기 API 및 결제 시스템
        caption: 2018.01 ~ 2022.04
        description: |
          * 카카오톡 주문하기 사용자 API 서버를 개발·운영하며 브랜드, 매장, 제품 및 주문 도메인의 기능 개선
          * 카카오페이 및 PG 이니시스 결제 페이지와 주문 결제 처리 기능 개발
          * Redis를 활용한 선착순 할인 쿠폰 기능 개발
          * E쿠폰사 API의 조회·승인·취소 기능을 주문 프로세스에 연계하고, 지연 승인 건 자동 취소 및 Webhook 기반 알림 기능 개발
          * Elastic Stack 기반 주문 API·결제·쿠폰 연동 로그 모니터링 및 오류 추적 환경 구축

          **기술**: Java, Spring Boot, MyBatis, MS-SQL, Redis, Elastic Stack, Linux, Windows Server

      - layout: left
        sub_title: 카카오톡 주문하기 운영 관리자 시스템
        caption: 2020.01 ~ 2022.04
        description: |
          * CS 업무와 브랜드·제품·매장 정보 관리를 위한 운영 관리자 시스템 개발·유지보수
          * 매출·정산 데이터를 집계하는 통계 및 정산 페이지 구축

          **기술**: Java, Spring Boot, MyBatis, MS-SQL, Windows Server
      - layout: left
        sub_title: 태국 LINE MAN 주문 서비스 연계
        caption: 2019.09 ~ 2019.11
        description: |
          * 태국 LINE MAN 주문 서비스와 브랜드·매장·제품 데이터를 연계하는 API 개발
          * 중개 서버에서 브랜드·매장·제품 데이터를 동기화하는 배치 개발

          **기술**: Java, Spring Boot, MyBatis, MS-SQL, Windows Server

