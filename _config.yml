about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Java/Spring 기반으로 주문·결제, 금융기관 연계와 정산 시스템을 개발·운영해 온 백엔드 개발자입니다.

  카카오톡 주문하기의 주문·결제 시스템과 은행·카드사 연계 서비스를 개발했습니다. 외부 API·금융 전문 연계부터 거래 대사, 집금·정산과 운영 백오피스까지 담당했으며, 연계 로직의 공통화와 배치 성능 개선 경험이 있습니다.

  동료들과 편하게 의견을 나누고 함께 문제를 해결하는 과정을 중요하게 생각합니다.

  **핵심 역량**

  * Java/Spring 기반 주문·결제·정산 서비스 개발·운영
  * 은행·카드사별 금융 전문 생성·송수신 로직을 공통 인터페이스와 기관별 구현체로 분리
  * 대량 데이터 처리 병목 분석 및 배치 성능 개선
  * .NET Framework 시스템의 Java/Spring Boot 전환과 중복 로직의 공통 모듈화
  * Elastic Stack 기반 거래 로그 수집 및 모니터링 환경 구축
  * 배포 자동화 파이프라인 및 Docker 기반 컨테이너 배포 환경 구축

